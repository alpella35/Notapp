name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clone repository
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.sha }}
    
    - name: Set up JDK 11
      run: |
        apt-get update
        apt-get install -y openjdk-11-jdk
    
    - name: Build APK
      working-directory: ./NotificationAlarmApp
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: NotificationAlarmApp/app/build/outputs/apk/debug/app-debug.apk
