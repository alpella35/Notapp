name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Install Android SDK
      run: |
        yes | ${ANDROID_HOME}/tools/bin/sdkmanager "platforms;android-34"
        yes | ${ANDROID_HOME}/tools/bin/sdkmanager "build-tools;34.0.0"
    
    - name: Debug Info
      run: |
        java -version
        ls -la $ANDROID_HOME/
    
    - name: Build APK
      run: |
        cd NotificationAlarmApp
        chmod +x gradlew
        ./gradlew assembleDebug -v 2>&1 | tail -100
    
    - name: Check APK
      run: ls -lah NotificationAlarmApp/app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: NotificationAlarmApp/app/build/outputs/apk/debug/app-debug.apk
