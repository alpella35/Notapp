name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > NotificationAlarmApp/local.properties
    
    - uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true
    
    - name: Build APK
      run: |
        cd NotificationAlarmApp
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: NotificationAlarmApp/app/build/outputs/apk/debug/app-debug.apk
