name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - uses: gradle/gradle-build-action@v3
    
    - name: Build APK
      run: |
        cd NotificationAlarmApp
        ./gradlew assembleDebug
    
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: NotificationAlarmApp/app/build/outputs/apk/debug/app-debug.apk
